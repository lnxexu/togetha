<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        justify-content: center;
      }
      .app-container {
        display: flex;
        max-width: 1200px;
        width: 100%;
        margin: 40px auto;
        gap: 20px;
      }
      .sidebar {
        width: 280px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 6px 32px rgba(60, 72, 88, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-header {
        background: linear-gradient(90deg, #6366f1 60%, #818cf8 100%);
        color: #fff;
        padding: 18px;
        font-weight: 600;
      }
      .new-chat-btn {
        margin: 15px;
        padding: 10px;
        background-color: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .new-chat-btn:hover {
        background-color: #e5e7eb;
      }
      .conversations-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }
      .conversation-item {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
      }
      .conversation-item:hover {
        background-color: #f3f4f6;
      }
      .conversation-item.active {
        background-color: #eef2ff;
        border-left: 3px solid #6366f1;
      }
      .conversation-icon {
        margin-right: 12px;
        color: #6366f1;
        width: 16px;
      }
      .conversation-title {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.95rem;
      }
      .conversation-actions {
        opacity: 0;
        transition: opacity 0.2s;
      }
      .conversation-item:hover .conversation-actions {
        opacity: 1;
      }
      .chat-container {
        max-width: 800px;
        flex: 1;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 6px 32px rgba(60, 72, 88, 0.15);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 600px;
      }
      .chat-header {
        background: linear-gradient(90deg, #6366f1 60%, #818cf8 100%);
        color: #fff;
        padding: 18px 24px;
        font-size: 1.3rem;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e0e7ff;
      }
      .chat-actions button {
        background: rgba(255, 255, 255, 0.12);
        border: none;
        color: #fff;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .chat-actions button:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .chat-messages {
        flex: 1;
        padding: 24px 18px 12px 18px;
        overflow-y: auto;
        background: #f3f4f6;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .chat-message {
        background: #fff;
        border-radius: 10px;
        padding: 12px 16px;
        box-shadow: 0 1px 4px rgba(60, 72, 88, 0.06);
        max-width: 80%;
        word-break: break-word;
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 2px;
        align-self: flex-start;
        animation: fadeIn 0.3s;
      }
      .chat-message.ocr-result {
        background: #eef2ff;
        border-left: 4px solid #6366f1;
        color: #3730a3;
        font-style: italic;
      }
      .chat-message.user {
        align-self: flex-end;
        background: #6366f1;
        color: #fff;
        border-radius: 10px 10px 2px 10px;
      }
      .chat-message.assistant {
        align-self: flex-start;
        background: #fff;
        color: #22223b;
        border-radius: 10px 10px 10px 2px;
      }
      .chat-input-container {
        display: flex;
        align-items: center;
        padding: 16px 18px;
        background: #f1f5f9;
        border-top: 1px solid #e0e7ff;
        gap: 8px;
      }
      .chat-input {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 1rem;
        background: #fff;
        box-shadow: 0 1px 2px rgba(60, 72, 88, 0.04);
        resize: none;
        outline: none;
        transition: box-shadow 0.2s;
      }
      .chat-input:focus {
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
      }
      .send-button,
      .ocr-button {
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        box-shadow: 0 1px 4px rgba(60, 72, 88, 0.08);
      }
      .send-button:hover,
      .ocr-button:hover {
        background: #3730a3;
        transform: scale(1.08);
      }
      .ocr-button {
        background: #818cf8;
        margin-left: 2px;
      }
      .ocr-button:hover {
        background: #6366f1;
      }
      .loading-indicator {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        color: #6366f1;
        font-weight: 500;
        font-size: 1rem;
      }
      .typing-dots {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .typing-dot {
        width: 7px;
        height: 7px;
        background: #6366f1;
        border-radius: 50%;
        display: inline-block;
        animation: blink 1.2s infinite both;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #6b7280;
        text-align: center;
        padding: 20px;
      }
      .empty-state i {
        font-size: 3rem;
        margin-bottom: 15px;
        color: #d1d5db;
      }
      .empty-state h3 {
        margin-bottom: 10px;
        font-weight: 600;
      }
      .empty-state p {
        max-width: 300px;
        margin: 0 auto;
      }
      @media (max-width: 768px) {
        .app-container {
          flex-direction: column;
          margin: 0;
          gap: 0;
        }
        .sidebar {
          width: 100%;
          border-radius: 0;
          min-height: auto;
          max-height: 40vh;
        }
        .chat-container {
          width: 100%;
          max-width: 100%;
          border-radius: 0;
          margin: 0;
        }
        .chat-header,
        .chat-input-container {
          padding-left: 10px;
          padding-right: 10px;
        }
        .chat-messages {
          padding-left: 8px;
          padding-right: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <div>Conversations</div>
        </div>
        <div class="new-chat-btn" id="new-chat-btn">
          <i class="fas fa-plus"></i>
          <span>New Chat</span>
        </div>
        <div class="conversations-list" id="conversations-list">
          <!-- Conversations will be listed here -->
        </div>
      </div>
      <div class="chat-container">
        <div class="chat-header">
          <div id="current-chat-title">{{ bot_name|default:"Togetha AI Assistant" }}</div>
          <div class="chat-actions">
            <button id="clear-chat" class="btn btn-sm btn-outline-light">
              <i class="fas fa-trash"></i> Clear Chat
            </button>
          </div>
        </div>
        <div class="chat-messages" id="chat-messages">
          <!-- Messages will appear here -->
          <div class="empty-state">
            <i class="fas fa-comments"></i>
            <h3>Start a new conversation</h3>
            <p>Send a message to begin chatting with the AI assistant</p>
          </div>
          <!-- Loading indicator -->
          <div
            id="loading-indicator"
            class="loading-indicator"
            style="display: none"
          >
            <div class="typing-dots">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
            <span>AI is thinking...</span>
          </div>
        </div>
        <div class="chat-input-container">
          <textarea
            class="chat-input"
            id="chat-input"
            placeholder="Type your message..."
            rows="1"
          ></textarea>
          <input
            type="file"
            id="ocr-image-input"
            accept="image/*"
            style="display: none"
          />
          <button class="send-button" id="send-button">
            <i class="fas fa-paper-plane"></i>
          </button>
          <button class="ocr-button" id="ocr-button" title="Upload image for OCR">
            <i class="fas fa-image"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      // Helper to get CSRF token from cookies
      const userToken = localStorage.getItem('token') || '';
      window.userToken = userToken;
      
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === name + "=") {
              cookieValue = decodeURIComponent(
                cookie.substring(name.length + 1)
              );
              break;
            }
          }
        }
        return cookieValue;
      }
      const csrftoken = getCookie("csrftoken");

      // DOM Elements
      const chatMessages = document.getElementById("chat-messages");
      const chatInput = document.getElementById("chat-input");
      const sendButton = document.getElementById("send-button");
      const clearChatButton = document.getElementById("clear-chat");
      const newChatButton = document.getElementById("new-chat-btn");
      const conversationsList = document.getElementById("conversations-list");
      const loadingIndicator = document.getElementById("loading-indicator");
      const currentChatTitle = document.getElementById("current-chat-title");

      // State
      let currentConversationId = null;
      
      // Load conversations on page load
      loadConversations();

      // Event listeners
      document.getElementById("ocr-button").addEventListener("click", function() {
        document.getElementById("ocr-image-input").click();
      });

      document.getElementById("ocr-image-input").addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // If no conversation is active, create a new one first
        if (!currentConversationId) {
          createNewConversation().then(() => {
            processOCRImage(file);
          });
        } else {
          processOCRImage(file);
        }
      });
      
      sendButton.addEventListener("click", sendMessage);
      
      chatInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      
      clearChatButton.addEventListener("click", clearCurrentChat);
      
      newChatButton.addEventListener("click", createNewConversation);

      // Functions
      function loadConversations() {
        fetch("/chatbot/conversations/", {
          headers: {
            "Authorization": "Token " + window.userToken
          },
          credentials: "same-origin"
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            conversationsList.innerHTML = "";
            
            if (data.length === 0) {
              // No conversations yet
              const emptyItem = document.createElement("div");
              emptyItem.className = "conversation-item empty";
              emptyItem.innerHTML = "No conversations yet";
              conversationsList.appendChild(emptyItem);
            } else {
              // Render conversations
              data.forEach(conversation => {
                addConversationToList(conversation);
              });
              
              // Load the most recent conversation
              if (!currentConversationId) {
                loadConversation(data[0].id);
              }
            }
          })
          .catch(error => {
            console.error("Error loading conversations:", error);
          });
      }
      
      function addConversationToList(conversation) {
        const item = document.createElement("div");
        item.className = `conversation-item ${conversation.id === currentConversationId ? "active" : ""}`;
        item.dataset.id = conversation.id;
        
        const lastMessage = conversation.last_message ? 
          conversation.last_message.content.substring(0, 30) + (conversation.last_message.content.length > 30 ? "..." : "") : 
          "New conversation";
          
        item.innerHTML = `
          <div class="conversation-icon">
            <i class="fas fa-comment-alt"></i>
          </div>
          <div class="conversation-title">${conversation.title || "New conversation"}</div>
          <div class="conversation-actions">
            <i class="fas fa-times delete-conversation" data-id="${conversation.id}" title="Delete conversation"></i>
          </div>
        `;
        
        item.addEventListener("click", function(e) {
          if (e.target.classList.contains("delete-conversation")) {
            deleteConversation(conversation.id);
            e.stopPropagation();
          } else {
            loadConversation(conversation.id);
          }
        });
        
        conversationsList.appendChild(item);
      }
      
      function loadConversation(conversationId) {
        fetch(`/chatbot/conversations/${conversationId}/`, {
          headers: {
            "Authorization": "Token " + window.userToken
          },
          credentials: "same-origin"
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            // Update current conversation
            currentConversationId = data.id;
            currentChatTitle.textContent = data.title || "New conversation";
            
            // Highlight active conversation in sidebar
            document.querySelectorAll(".conversation-item").forEach(item => {
              item.classList.remove("active");
              if (item.dataset.id === data.id) {
                item.classList.add("active");
              }
            });
            
            // Clear messages
            chatMessages.innerHTML = "";
            
            // Add messages
            if (data.messages.length === 0) {
              // Empty state
              chatMessages.innerHTML = `
                <div class="empty-state">
                  <i class="fas fa-comments"></i>
                  <h3>Start a new conversation</h3>
                  <p>Send a message to begin chatting with the AI assistant</p>
                </div>
              `;
            } else {
              // Add all messages
              data.messages.forEach(message => {
                addMessageToUI(message.content, message.message_type);
              });
            }
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
          })
          .catch(error => {
            console.error("Error loading conversation:", error);
          });
      }
      
      function createNewConversation() {
        return fetch("/chatbot/conversations/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
            "Authorization": "Token " + window.userToken
          },
          body: JSON.stringify({
            title: "New conversation"
          }),
          credentials: "same-origin"
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            // Update current conversation
            currentConversationId = data.id;
            
            // Refresh conversation list
            loadConversations();
            
            // Clear messages
            chatMessages.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-comments"></i>
                <h3>Start a new conversation</h3>
                <p>Send a message to begin chatting with the AI assistant</p>
              </div>
            `;
            
            // Update title
            currentChatTitle.textContent = data.title || "New conversation";
            
            return data;
          })
          .catch(error => {
            console.error("Error creating conversation:", error);
          });
      }
      
      function deleteConversation(conversationId) {
        if (confirm("Are you sure you want to delete this conversation?")) {
          fetch(`/chatbot/conversations/${conversationId}/`, {
            method: "DELETE",
            headers: {
              "X-CSRFToken": csrftoken,
              "Authorization": "Token " + window.userToken
            },
            credentials: "same-origin"
          })
            .then(response => {
              if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
              }
              
              // If we deleted the current conversation
              if (conversationId === currentConversationId) {
                currentConversationId = null;
                chatMessages.innerHTML = `
                  <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <h3>Start a new conversation</h3>
                    <p>Send a message to begin chatting with the AI assistant</p>
                  </div>
                `;
                currentChatTitle.textContent = "Togetha AI Assistant";
              }
              
              // Refresh conversation list
              loadConversations();
            })
            .catch(error => {
              console.error("Error deleting conversation:", error);
            });
        }
      }
      
      function clearCurrentChat() {
        if (!currentConversationId) return;
        
        if (confirm("Are you sure you want to clear this chat?")) {
          // Just clear the UI and keep the conversation
          chatMessages.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-comments"></i>
              <h3>Chat cleared</h3>
              <p>Send a message to begin chatting with the AI assistant</p>
            </div>
          `;
          
          // You could also implement a backend endpoint to clear messages but keep the conversation
          // For now, we'll create a new conversation
          createNewConversation();
        }
      }
      
      function processOCRImage(file) {
        const formData = new FormData();
        formData.append("image", file);

        // Show loading indicator
        loadingIndicator.style.display = "block";

        fetch("/chatbot/api/ocr/", {
          method: "POST",
          headers: {
            "X-CSRFToken": csrftoken,
            "Authorization": "Token " + window.userToken
          },
          body: formData,
          credentials: "same-origin"
        })
          .then(response => {
            if (!response.ok) {
              return response.json().then(data => {
                throw new Error(data.error || `HTTP error! Status: ${response.status}`);
              });
            }
            return response.json();
          })
          .then(data => {
            loadingIndicator.style.display = "none";
            
            if (data.text) {
              // First remove empty state if it exists
              const emptyState = chatMessages.querySelector(".empty-state");
              if (emptyState) {
                emptyState.remove();
              }
              
              // Display OCR result as a new message in chat
              const ocrMsg = document.createElement("div");
              ocrMsg.className = "chat-message ocr-result";
              ocrMsg.innerHTML = `<strong>OCR Result:</strong><br>${data.text}`;
              chatMessages.appendChild(ocrMsg);
              chatMessages.scrollTop = chatMessages.scrollHeight;
              
              // Send the OCR result to the chatbot as a user message
              sendMessageToBackend(data.text);
            } else {
              alert(data.error || "OCR failed: No text detected.");
            }
          })
          .catch(error => {
            loadingIndicator.style.display = "none";
            console.error("OCR Error:", error);
            alert(`OCR failed: ${error.message || "Unknown error"}`);
          });
      }
      
      function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;
        
        // Clear input
        chatInput.value = "";
        
        // If no conversation is active, create a new one first
        if (!currentConversationId) {
          createNewConversation().then(data => {
            sendMessageToBackend(message);
          });
        } else {
          sendMessageToBackend(message);
        }
      }
      
      function sendMessageToBackend(message) {
        // First remove empty state if it exists
        const emptyState = chatMessages.querySelector(".empty-state");
        if (emptyState) {
          emptyState.remove();
        }
        
        // Add user message to UI
        addMessageToUI(message, "user");
        
        // Show loading indicator
        loadingIndicator.style.display = "block";
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        // Send message to backend
        fetch(`/chatbot/conversations/${currentConversationId}/messages/`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
            "Authorization": "Token " + window.userToken
          },
          body: JSON.stringify({
            message: message
          }),
          credentials: "same-origin"
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            // Hide loading indicator
            loadingIndicator.style.display = "none";
            
            // Add assistant response to UI
            addMessageToUI(data.response, "assistant");
            
            // Update title if it's a new conversation
            if (currentChatTitle.textContent === "New conversation" && data.conversation_id) {
              // Generate a title
              fetch(`/chatbot/conversations/${data.conversation_id}/generate-title/`, {
                method: "POST",
                headers: {
                  "X-CSRFToken": csrftoken,
                  "Authorization": "Token " + window.userToken
                },
                credentials: "same-origin"
              })
                .then(response => response.json())
                .then(titleData => {
                  currentChatTitle.textContent = titleData.title;
                  loadConversations(); // Refresh conversation list with new title
                })
                .catch(error => console.error("Error generating title:", error));
            }
          })
          .catch(error => {
            // Hide loading indicator
            loadingIndicator.style.display = "none";
            
            console.error("Error sending message:", error);
            
            // Show error message
            const errorMsg = document.createElement("div");
            errorMsg.className = "chat-message system";
            errorMsg.textContent = "Error: Failed to send message. Please try again.";
            chatMessages.appendChild(errorMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
          });
      }
      
      function addMessageToUI(content, type) {
        const message = document.createElement("div");
        message.className = `chat-message ${type}`;
        message.textContent = content;
        chatMessages.appendChild(message);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    </script>
  </body>
</html>
