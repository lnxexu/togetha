name: Build and Publish Backend Docker Image

on:
  push:
    branches: [ main, master, Paul(Test_deployment) ]
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO_LOWER}-backend" >> $GITHUB_OUTPUT

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ steps.vars.outputs.name }}:latest
            ${{ steps.vars.outputs.name }}:${{ github.sha }}

      - name: Output image reference
        run: echo "Pushed ${{ steps.vars.outputs.name }}:latest"
